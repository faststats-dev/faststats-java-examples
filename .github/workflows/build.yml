name: Build
on:
  push:
    branches:
      - main
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v7.0.1
      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: 25
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
      - name: Build with Gradle
        run: ./gradlew build
        env:
          # Written into the build-token example's resources at build time, see build-token/build.gradle.kts
          # Secrets are not available to pull requests from forks, those jars contain an empty token and run with FastStats disabled
          FASTSTATS_TOKEN: ${{ secrets.FASTSTATS_TOKEN }}
      - name: Build Maven example
        run: mvn -B -f build-token-maven/pom.xml package
        env:
          FASTSTATS_TOKEN: ${{ secrets.FASTSTATS_TOKEN }}
